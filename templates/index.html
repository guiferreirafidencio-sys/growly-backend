<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growly — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/index-page.css') }}">
</head>
<body>

  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="floater f1">★</div>
  <div class="floater f2">◆</div>
  <div class="floater f3">✦</div>
  <div class="floater f4">●</div>

  <div class="card">

    <!-- LOGO centralizado -->
    <div class="logo-wrap">
      <a href="/" class="logo">
        <span class="logo-text">Growly</span>
        <svg class="logo-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#ff3cac"/>
              <stop offset="50%"  stop-color="#c060ff"/>
              <stop offset="100%" stop-color="#00cfff"/>
            </linearGradient>
          </defs>
          <path d="M12 2 L13.8 9.2 L21 12 L13.8 14.8 L12 22 L10.2 14.8 L3 12 L10.2 9.2 Z"
                fill="url(#starGrad)"/>
        </svg>
      </a>
    </div>

    <!-- HEADLINE fonte legível -->
    <h1 class="headline" style="text-align:center">seja bem-<span>vindo</span></h1>
    <p class="sub" style="text-align:center">entra com sua conta do Google e vamos nessa</p>

    <a href="/auth/login" class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      continuar com Google
    </a>

    <div class="divider">ou</div>

    <p class="terms">
      ao entrar você concorda com os<br>
      <a href="#">termos de uso</a> e <a href="#">política de privacidade</a>
    </p>

  </div>

</body>
</html>
